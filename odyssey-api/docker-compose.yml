services:
  postgres:
    image: postgres:16
    container_name: odyssey-postgres
    environment:
      POSTGRES_DB: odyssey
      POSTGRES_USER: odyssey
      POSTGRES_PASSWORD: odyssey
    ports:
      - "5432:5432"
    volumes:
      - odyssey_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: odyssey-redis
    ports:
      - "6379:6379"

volumes:
  odyssey_postgres_data:
