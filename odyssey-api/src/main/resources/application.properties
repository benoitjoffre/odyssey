spring.application.name=odyssey-api

spring.ai.openai.api-key=${OPENAI_API_KEY:missing}

spring.datasource.url=jdbc:postgresql://localhost:5432/odyssey
spring.datasource.username=odyssey
spring.datasource.password=odyssey

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

spring.data.redis.host=localhost
spring.data.redis.port=6379

# Stripe (TEST MODE only). Credentials come from environment variables,
# never hardcoded/committed. See README/report for required env vars.
stripe.secret-key=${STRIPE_SECRET_KEY:}
stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:}
stripe.success-url=${STRIPE_SUCCESS_URL:http://localhost:5173/traveler/quotes?payment=success}
stripe.cancel-url=${STRIPE_CANCEL_URL:http://localhost:5173/traveler/quotes?payment=cancelled}